services:
  - type: web
    name: a13-career-planner
    runtime: python
    plan: free
    buildCommand: cd app/frontend && npm ci && npm run build && cd ../.. && pip install -r app/backend/requirements.txt
    startCommand: uvicorn app.backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_API_KEY
        sync: false
